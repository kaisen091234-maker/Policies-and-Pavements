*,*::before,*::after{box-sizing:inherit}

.card,.go,input{font:inherit;color:var(--fg)}

.card:disabled{opacity:.45;cursor:not-allowed}.card.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}

.go{background:var(--ac);color:var(--acf);border:0;border-radius:12px;padding:12px 18px;margin:12px 0;width:100%;font-weight:600;cursor:pointer}
input{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:4px 0 10px}
.note{background:var(--card);border-left:4px solid var(--ac);border-radius:6px;padding:8px 10px;margin:8px 0;font-size:.9rem}
.big{font-size:2rem;font-weight:700}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
#app>*{animation:in .4s ease backwards}
.card,.go{transition:transform .2s ease,opacity .25s ease,border-color .2s,box-shadow .2s}
.card:not(:disabled):hover{transform:translateY(-2px)}
.card:not(:disabled):active,.go:active{transform:scale(.98)}
.chosen{transform:scale(1.02)!important;box-shadow:0 0 0 2px var(--ac)}
.dim{opacity:.2;transform:scale(.97)!important;pointer-events:none}
.bar i{transition:width .7s cubic-bezier(.2,.8,.2,1),background .3s}
@keyframes tmr{from{opacity:.6}}
.tm{margin:6px 0}.tr{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--mut);margin-top:4px}
.sp{font:inherit;font-size:.75rem;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:3px 8px;margin-left:4px;cursor:pointer}
.sp.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
#tb{transition:width .1s linear}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

["Promise repairs after the rainy season","People note the date.",[0,0,-3,-2,0],0,0,-2],
["Blame the previous administration","The excuse gets old fast.",[0,0,-6,-3,0],0,0,-3]]],
["Old friends invite you out","They say you have been working too much.","PERSONAL",[
["Go to dinner and leave your phone","You laugh for the first time in weeks.",[0,3,1,0,0],2,0,18],
["Say you will go next time","The invite does not come again.",[0,0,0,0,0],0],
["Work through the night instead","The report is done. You are not.",[0,-3,-2,0,0],0,0,-8]],s=>s.sanity<=60],
["A counselor is recommended","A trusted aide quietly shares a contact.","PERSONAL",[
["Book regular sessions","It helps more than you expected.",[0,2,0,0,0],3,0,22],
["Try a meditation app","A small, steady relief.",[0,0,0,0,0],0,0,8],
["Tough it out","You tell yourself you are fine.",[0,-2,-3,-2,0],0,0,-8]],s=>s.sanity<=45],
["A call from home","A relative is in the hospital and wants you there.","PERSONAL",[
["Go home immediately","You miss meetings but gain peace.",[0,0,-2,0,0],0,0,12],
["Visit briefly between meetings","You manage both, barely.",[0,0,-1,0,0],0,0,4],
["Stay in the meeting","Colleagues notice how distracted you are.",[0,-3,-6,-4,0],0,0,-10]]],
["A morning run with commuters","A neighborhood group invites you along.","PERSONAL",[
["Join the jog and chat with riders","You feel alive and learn a lot.",[0,8,3,3,0],0,0,6],
["Skip it and sleep in","Your body thanks you.",[0,3,0,0,0],0,0,4],
["Send a staged photo-op instead","Everyone can tell.",[0,0,-5,-3,0],0,0,-2]],s=>s.health<=55],
["You are close to breaking","Your hands shake and staff whisper in the corridor.","SANITY",[
["Take a sabbatical week","The city waits. You heal.",[0,4,-6,-3,0],0,0,40],
["Talk to a trusted friend","Hard, but it lifts the weight.",[0,0,0,0,0],0,0,20],
["Pretend everything is fine","A live interview goes badly wrong.",[0,-5,-25,-15,0],0,"You break down on live television. Your term ends in shame."]],s=>s.sanity<=30],
["An old recording leaks","Audio of you insulting commuters surfaces online.","LEAK",[
["Apologize in person at a terminal","It is uncomfortable, and it works.",[0,0,2,2,0],0,0,-2],
["Say it was taken out of context","Few buy it.",[0,0,-9,-5,0],0,0,-4],
["Deny it was you","Voice analysis proves otherwise.",[0,0,-30,-25,0],0,"The recording is verified and the denial ends your term."]]],
["A stranger offers you a ride","It is pouring and your driver is stuck in traffic.","THREAT",[
["Wait inside and keep calling your driver","You are late, and you are safe.",[0,0,-1,0,0],0,0,-2],
["Take a licensed taxi from the stand","A boring ride, a safe ride.",[0,0,0,0,0],1],
["Accept the stranger’s ride","The route turns onto a dark road.",[0,-30,-30,-30,0],0,"The ride does not end at your destination. Your term ends tonight."]]],
["Crowd surge at a terminal festival","The venue is overfull and people are pushing.","CROWD",[
["Halt entry and open extra exits","Everyone is safe, and annoyed.",[0,2,1,2,0],4,0,-2],
["Let security handle it quietly","Injuries, but no catastrophe.",[0,-6,-6,-3,0],1,0,-4],
["Keep the show going","A barrier gives way.",[0,-25,-30,-20,0],0,"A crowd crush ends in tragedy. Your government falls."]]],
["A tycoon wants naming rights","A businessman offers cash for a terminal named after him.","BUDGET",[
["Accept with strict conditions","Funds arrive, with oversight.",[0,0,2,2,0],-10],
["Decline politely","Principled, but it costs you.",[0,0,1,2,0],0],
["Auction the name to the highest bidder","The bidding gets ugly.",[0,0,-10,-8,0],-25]],s=>s.budget>=85],
["Operators offer to self-fund upgrades","Years of goodwill are paying off.","OFFER",[
["Accept and share the credit","A win for everyone.",[3,0,3,4,4],2,0,5],
["Take full credit alone","The operators notice.",[0,0,2,-8,0],0],
["Decline to avoid favors","Cautious, but the offer fades.",[0,0,-1,-2,0],0]],s=>s.trust>=80],
["A fan club forms around you","Posters, mugs, and a theme song.","PERSONAL",[
["Stay humble and credit the team","Staff love it.",[0,0,3,4,0],0,0,6],
["Hold a big rally","Loud, fun, and expensive.",[0,0,2,-2,0],3,0,3],
["Start believing it is all you","Your aides stop telling you the truth.",[0,0,-8,-8,0],0,0,-10]],s=>s.approval>=85],
["A climate lawsuit is filed","Students and lawyers say the region is not doing enough.","CLIMATE",[
["Settle and commit to targets","Costly, but credible.",[4,0,-2,2,6],8,0,-2],
["Fight it in court","Slow and tense.",[0,0,-4,-3,-4],4,0,-5],
["Dismiss it publicly","The headlines write themselves.",[-3,0,-10,-6,-6],0,0,-6]],s=>s.climate<=25]];
const CB=[["CLEAN","DRIVER",1,[0,0,0,2,4,0],"Just Transition"],["MOBILITY","SAFETY",1,[0,3,0,2,0,0],"Safer Mobility"],["GOVERNANCE","COMMUNITY",0,[0,0,0,3,3,0],"Public Accountability"],["CLEAN","MOBILITY",0,[2,0,0,0,0,2],"Cleaner Corridors"]];
const SY=[["ACCIDENT","SAFETY",[0,2,0,0,0,0],"safety work speeds response"],["PROTEST","DRIVER",[0,0,0,0,3,0],"driver goodwill"],["STRIKE","DRIVER",[0,0,0,1,3,0],"driver goodwill"],["FLOOD","INFRA",[0,1,0,3,0,0],"earlier drainage repairs"],["ROADWORK","GOVERNANCE",[0,0,0,2,1,0],"open contracting"],["POLLUTION","CLEAN",[3,0,0,0,0,2],"clean-air groundwork"],["MISINFO","GOVERNANCE",[0,0,0,3,0,0],"credible published data"],["MISINFO","COMMUNITY",[0,0,0,0,2,0],"community council helps"],["SAFETY","SAFETY",[0,2,0,1,0,0],"safety groundwork"],["OVERLOAD","MOBILITY",[0,1,0,2,0,0],"priority lanes"],["ENERGY","CLEAN",[1,0,0,0,0,3],"clean-vehicle credibility"]];

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cl=x=>Math.max(0,Math.min(100,x));
const rn=s=>()=>{s=s+1831565813|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuf=(a,r)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const add=(st,fx)=>K.forEach((k,i)=>st[k]=cl(st[k]+(fx[i]||0)));
const fmt=fx=>fx.map((v,i)=>v?SH[i]+" "+(v>0?"+":"")+v:"").filter(Boolean).join(", ")||"no change";
const has=t=>S.tags.includes(t);
const pcost=p=>Math.max(1,p[3]-(S.c[4]=="BUSINESS"?2:0));
const ecost=c=>S.c[4]=="DATA"&&c>0?c-1:c;
let S={s:"start",pick:0},PV={},busy=0,T=null;
const risky=e=>e[3].some(o=>o[4]||Math.min(...o[2])<=-8);
const tmr=()=>S.s=="policy"||S.s=="event"?`<div class="tm"><div class="bar"><i id="tb" data-w="100" style="width:100%"></i></div><div class="tr"><span id="tt">20s</span><span>${[1,2,3,4,5].map(n=>`<button class="sp${n==S.speed?" on":""}" onclick="setSp(${n})">x${n}</button>`).join("")}</span></div></div>`:"";
function pickEv(){const ok=E.map((e,i)=>i).filter(i=>!S.used.includes(i)&&(!E[i][4]||E[i][4](S.st)));const pool=ok.flatMap(i=>E[i][4]?[i,i,i]:[i]);const i=pool[Math.floor(S.r()*pool.length)];S.used.push(i);return i}
function stopT(){clearInterval(T);T=null}
function upd(){const b=$("tb"),t=$("tt");if(!b)return;b.style.width=Math.max(0,S.t/20*100)+"%";t.textContent=S.pz?"⏸ Timer paused: high-risk event":Math.ceil(Math.max(0,S.t))+"s"}
function startT(){S.t=20;S.pz=S.s=="event"&&risky(E[S.cur]);upd();T=setInterval(()=>{if(S.pz)return;S.t-=.1*S.speed;upd();if(S.t<=0){stopT();late()}},100)}
function setSp(n){S.speed=n;document.querySelectorAll(".sp").forEach(b=>b.classList.toggle("on",b.textContent=="x"+n))}
function late(){if(S.s=="policy"){const pen=[0,0,0,-3,-2,0];add(S.st,pen);S.msg=["Time ran out! Indecision: "+fmt(pen)];S.s="event";render()}else if(S.s=="event"){const o=E[S.cur][3];let i=o.length-1;while(i>0&&ecost(o[i][3])>S.st.budget)i--;S.late=1;resolve(i)}}
function go(e,f){if(busy)return;busy=1;stopT();e.classList.add("chosen");document.querySelectorAll("#app .card,#app .go").forEach(x=>{if(x!==e)x.classList.add("dim")});setTimeout(()=>{busy=0;f()},400)}

function pick(i){S.pick=i;document.querySelectorAll(".cls").forEach((e,j)=>e.classList.toggle("on",j==i))}
function begin(){
 const name=$("nm").value.trim().slice(0,20);
 if(!name){$("nm").focus();return}
 let seed=parseInt($("sd").value,10)||0;
 if(seed<1||seed>999999)seed=1+Math.floor(Math.random()*999999);
 PV={};const c=CL[S.pick],r=rn(seed);
 S={s:"policy",name,c,seed,r,st:{air:50,health:80,budget:70,approval:60,trust:60,climate:50,sanity:100},pol:[],tags:[],term:1,speed:1,spent:0,res:0,combos:0,msg:[]};
 if(c[4]=="POPULAR")add(S.st,[0,0,0,5,0,0]);
 if(c[4]=="TRANSIT")add(S.st,[0,0,0,0,8,0]);
 if(c[4]=="DATA")add(S.st,[0,5,0,0,0,0]);
 S.used=[];S.cur=null;
 draft();
}
function draft(){
 S.s="policy";
 S.d=shuf(P.filter(p=>!S.pol.includes(p[0])),S.r).slice(0,3);
 render();
}
function take(i){
 const p=S.d[i],cost=pcost(p);
 if(cost>S.st.budget)return;
 const fx=p[4].slice(),m=[];
 if(S.c[4]=="GREEN"&&p[2]=="CLEAN"){fx[0]+=2;fx[5]+=2;m.push("Green Planner bonus: +2 air, +2 climate")}
 CB.forEach(([a,b,two,f,n])=>{if((p[2]==a&&has(b))||(two&&p[2]==b&&has(a))){f.forEach((v,j)=>fx[j]+=v);S.combos++;m.push("COMBO – "+n+": "+fmt(f))}});
 if(S.st.sanity<=30&&p[2]=="COMMUNITY"){fx[6]=(fx[6]||0)+4;fx[3]+=2;m.push("Community support lifts your spirits (+4 sanity, +2 approval)")}
 if(S.st.sanity<=30&&S.r()<.4){fx[3]-=4;m.push("Exhausted slip: you misspeak at the announcement (Approval -4)")}
 fx[6]=(fx[6]||0)+Math.round(fx[1]/2);fx[1]=0;
 [["trust",["INFRA","MOBILITY","CLEAN"],[0,0,0,-6,-4,0],"commuters and operators protest the project"],["approval",["INFRA","MOBILITY","CLEAN","GOVERNANCE"],[0,0,0,-6,-3,0],"low public support turns the announcement into outrage"]].forEach(([k,tg,f,n])=>{const v=S.st[k];if(v<=40&&tg.includes(p[2])&&S.r()<Math.min(1,(45-v)/25)){f.forEach((x,j)=>fx[j]+=x);m.push("BACKLASH ("+n+"): "+fmt(f))}});
 S.st.budget-=cost;S.spent+=cost;add(S.st,fx);S.pol.push(p[0]);
 if(!has(p[2]))S.tags.push(p[2]);
 const sh=fx.slice();sh[2]-=cost;
 S.msg=["Adopted “"+p[0]+"”: "+fmt(sh)].concat(m);
 S.s="event";render();
}
function austerity(){
 add(S.st,[0,-1,0,-2,-1,-1]);
 S.msg=["No drafted policy was affordable. Austerity: "+fmt([0,-1,0,-2,-1,-1])];
 S.s="event";render();
}
function resolve(i){
 const e=E[S.cur],o=e[3][i],cost=ecost(o[3]);
 if(cost>S.st.budget)return;
 const resp=o[3]>0,t=e[2],ct=S.c[4],fx=[o[2][0],o[2][1],0,o[2][2],o[2][3],o[2][4],o[5]||0],m=[];if(Math.min(...o[2])<=-8)fx[6]-=5;
 const bon=(f,n)=>{f.forEach((v,j)=>fx[j]+=v);m.push(n+": "+fmt(f))};
 if(S.late){m.push("Time ran out, so the default response was used.");S.late=0}
 if(resp&&S.st.trust<=30&&(t=="PROTEST"||t=="STRIKE")&&S.r()<.5)bon([0,0,0,-4,-4,0],"Low trust: talks break down");
 if(resp&&S.st.approval<=30&&(t=="MISINFO"||t=="LEAK")&&S.r()<.5)bon([0,0,0,-4,0,0],"Low approval: nobody believes the statement");
 if(ct=="POPULAR"){bon([0,0,0,2,0,0],"Everybody’s Favorite");if(resp&&(t=="MISINFO"||t=="SAFETY"))bon([0,0,0,2,0,0],"Community dialogue")}
 if(ct=="TRANSIT"&&resp&&["PROTEST","STRIKE","ACCIDENT"].includes(t)){bon([0,0,0,1,2,0],"Transit Insider");if(t!="ACCIDENT")bon([0,0,0,0,2,0],"Easier negotiation")}
 if(ct=="BUSINESS"&&resp&&(t=="ROADWORK"||t=="FLOOD"))bon([0,0,3,0,0,0],"Business group support");
 if(ct=="GREEN"&&resp&&t=="POLLUTION")bon([3,0,0,0,0,2],"Green Planner response");
 if(ct=="DATA"&&resp&&t=="POLLUTION")bon([2,2,0,0,0,0],"Air-quality report");
 if(resp)SY.forEach(([a,b,f,n])=>{if(a==t&&has(b))bon(f,"Policy synergy ("+n+")")});
 S.st.budget=cl(S.st.budget-cost);S.spent+=Math.max(0,cost);add(S.st,fx);S.res++;
 const sh=fx.slice();sh[2]-=cost;
 if(o[4])S.bad=o[4];S.out={lab:o[0],t:o[1],m,e:fmt(sh)};
 S.s="result";render();
}
function next(){
 const s=S.st;
 const bad=S.bad||(s.approval<=10?"Public approval has collapsed. You lose the mandate to govern.":s.trust<=10?"Transport operators have lost faith and services are paralyzed.":s.health<=10?"Your health gives out and you are hospitalized. You must resign.":s.sanity<=10?"The stress is too much. You suffer a breakdown and resign.":s.air<=10?"Air quality reaches emergency levels and a crisis is declared.":"");
 if(bad||S.term>=10){S.s="end";S.bad=bad;render();return}
 S.term++;S.cur=null;S.msg=[];add(S.st,[0,0,0,0,0,0,-5]);if(S.term%2){add(S.st,[0,0,18,0,0,0]);S.msg=["A new term begins. Revenue: +18 budget."]}
 draft();
}
function restart(){S={s:"start",pick:S.pick};render()}

const bars=()=>K.map((k,i)=>{const v=S.st[k];return `<div class="m"><span>${LB[i]}</span><b>${v}</b><div class="bar"><i class="${v<=25?"lo":""}" style="width:${PV[k]??v}%" data-w="${v}"></i></div></div>`}).join("");
const notes=a=>a.map(x=>`<div class="note">${esc(x)}</div>`).join("");

function render(){
 const s=S.s;let h="";
 if(s=="start"){
  h=`<h1>Policies &amp; Pavements</h1><p class="mut">Guide your region through 10 turns (5 terms) of transport and clean-air policy. Each turn: draft one policy, then respond to one event. Outcomes are hidden, and a few bad calls can end your run on the spot. You get 20 seconds per decision (speed it up for bonus points), and the clock pauses on high-risk events. Some events only appear when your stats are very high or very low. Your sanity drains every turn, so look for ways to rest. Numbers are illustrative game values, not forecasts.</p>
  <h2>Governor name</h2><input id="nm" maxlength="20" placeholder="Your name" autocomplete="off">
  <h2>Class</h2>`+CL.map((c,i)=>`<button class="card cls${i==S.pick?" on":""}" onclick="pick(${i})"><b>${c[0]}</b><small>${c[1]}</small><small>Passive: ${c[2]}</small><small>Special: ${c[3]}</small></button>`).join("")+
  `<h2>Seed <span class="mut">(optional, for a repeatable run)</span></h2><input id="sd" type="number" min="0" max="999999" placeholder="0 = random"><button class="go" onclick="begin()">Start governing</button>`;
 }else{
  h=`<p class="top">Turn ${S.term}/10 · Term ${Math.ceil(S.term/2)}/5 · ${esc(S.name)} · ${S.c[0]} · Seed ${S.seed}</p><div class="grid">${bars()}</div><p class="mut">Policies: ${S.pol.length} · Combos: ${S.combos}</p>${tmr()}`;
  if(s=="policy"){
   const ok=S.d.some(p=>pcost(p)<=S.st.budget);
   h+=notes(S.msg)+`<h2>Policy draft</h2><p class="mut">Outcomes are hidden, so read carefully. Active policy tags set up combos.${(S.st.trust<=40||S.st.approval<=40)?" ⚠ Low public support: big projects may spark protests.":""}</p>`+S.d.map((p,i)=>`<button class="card" ${pcost(p)>S.st.budget?"disabled":""} onclick="go(this,()=>take(${i}))"><b>${p[0]}</b><span class="tag">${p[2]}</span><span style="float:right">Cost ${pcost(p)}</span><small>${p[1]}</small></button>`).join("")+(ok?"":`<button class="go" onclick="go(this,()=>austerity())">Nothing affordable: enter austerity</button>`);
  }else if(s=="event"){
   if(S.cur==null)S.cur=pickEv();const e=E[S.cur];
   h+=notes(S.msg)+`<h2>${e[0]}</h2><p>${e[1]}</p>`+e[3].map((o,i)=>`<button class="card" ${ecost(o[3])>S.st.budget?"disabled":""} onclick="go(this,()=>resolve(${i}))">${o[0]}<span style="float:right">${ecost(o[3])<0?"Gain "+-ecost(o[3]):"Cost "+ecost(o[3])}</span></button>`).join("");
  }else if(s=="result"){
   h+=`<h2>${S.out.lab}</h2><p>${S.out.t}</p>${notes(S.out.m)}<p><b>Effects:</b> ${S.out.e}</p><button class="go" onclick="go(this,()=>next())">${S.bad||S.term>=10?"See the outcome":"Next turn"}</button>`;
  }else{
   const x=S.st,sc=x.air+x.health+x.sanity+x.approval+x.trust+x.climate+S.combos*5+Math.floor(x.budget/5)+(S.speed-1)*5;
   const rt=S.bad?"Failed Term":sc>=500?"Landmark Governor":sc>=430?"Respected Reformer":sc>=360?"Steady Hand":"Rough Term";
   h+=`<h2>${S.bad?"Government collapsed":"Your governorship ends"}</h2>${S.bad?`<p>${S.bad}</p>`:""}<p class="big">${sc}</p><p><b>${rt}</b></p>
   <p class="mut">Events resolved: ${S.res} · Budget spent: ${S.spent} · Combos: ${S.combos} · Speed bonus: ${(S.speed-1)*5}</p><h2>Policies adopted</h2><p>${S.pol.map(esc).join("<br>")||"None"}</p><button class="go" onclick="go(this,()=>restart())">Play again</button>`;
  }
 }
 $("app").innerHTML=h;window.scrollTo(0,0);[...$("app").children].forEach((c,i)=>c.style.animationDelay=Math.min(i*50,400)+"ms");requestAnimationFrame(()=>requestAnimationFrame(()=>{document.querySelectorAll(".bar i").forEach(i=>i.style.width=i.dataset.w+"%")}));if(S.st)PV=Object.assign({},S.st);stopT();if(s=="policy"||s=="event")startT();
}
render();
</script></body></html>
